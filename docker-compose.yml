services:
  postgres:
    image: postgres:16
    container_name: aurum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aurum
      POSTGRES_PASSWORD: aurum
      POSTGRES_DB: aurum
    ports:
      - "5432:5432"
    volumes:
      - aurum-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurum -d aurum"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: aurum-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - aurum-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aurum-pg:
  aurum-redis:
